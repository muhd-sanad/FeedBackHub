<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give Feedback - FeedBackHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        FeedBack<span>Hub</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="feedback.html">Feedback</a>
        <a href="admin-login.html">Admin</a>
    </nav>

</header>

<main class="feedback-page">

    <div class="feedback-header">

        <div class="badge">Student Portal</div>

        <h1>Share Your Feedback</h1>

        <p>
            Your feedback helps us improve.
            Please share your honest experience.
        </p>

    </div>


    <div class="feedback-card">

        <form onsubmit="submitFeedback(event)" id="feedbackForm">

            <!-- Student ID -->

            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Example: STU102"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="studentEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="student@example.com"
                    required
                >

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Feedback Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select a category
                    </option>

                    <option value="Teaching">
                        Teaching
                    </option>

                    <option value="Course">
                        Course
                    </option>

                    <option value="Facilities">
                        Facilities
                    </option>

                    <option value="Events">
                        Events
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Rating -->

            <div class="form-group">

                <label>
                    How would you rate your experience?
                </label>

                <div class="star-rating">

                    <label>
                        <input type="radio" name="rating" value="1">
                        <span>⭐</span>
                    </label>

                    <label>
                        <input type="radio" name="rating" value="2">
                        <span>⭐⭐</span>
                    </label>

                    <label>
                        <input type="radio" name="rating" value="3">
                        <span>⭐⭐⭐</span>
                    </label>

                    <label>
                        <input type="radio" name="rating" value="4">
                        <span>⭐⭐⭐⭐</span>
                    </label>

                    <label>
                        <input type="radio" name="rating" value="5">
                        <span>⭐⭐⭐⭐⭐</span>
                    </label>

                </div>

            </div>


            <!-- Feedback -->

            <div class="form-group">

                <label for="feedback">
                    Your Feedback
                </label>

                <textarea
                    id="feedback"
                    rows="6"
                    placeholder="Write your feedback here..."
                    required
                ></textarea>

            </div>


            <button type="submit" class="submit-btn">
                Submit Feedback →
            </button>

        </form>


        <!-- Success -->

        <div class="success-message" id="successMessage">

            <div class="success-icon">
                ✓
            </div>

            <h2>Feedback Submitted!</h2>

            <p>
                Thank you for sharing your feedback.
            </p>

            <a href="index.html" class="btn primary">
                Back to Home
            </a>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 FeedBackHub | Student Feedback System</p>
</footer>

<script src="script.js"></script>

</body>
</html>
