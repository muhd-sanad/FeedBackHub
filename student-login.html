<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - FeedBackHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-container">

    <div class="login-box">

        <div class="login-logo">
            FeedBack<span>Hub</span>
        </div>

        <div class="login-icon">🎓</div>

        <h1>Student Login</h1>

        <p class="login-subtitle">
            Login to submit your feedback
        </p>

        <form onsubmit="studentLogin(event)">

            <div class="form-group">
                <label>Email Address</label>

                <input
                    type="email"
                    id="studentLoginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('studentPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button type="submit" class="login-btn">
                Login →
            </button>

        </form>

        <p class="demo-note">
            Demo: enter any email and password.
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
